[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c-llvm-dataset"
version = "0.1.0"
description = "Reproducible, execution-checked C to LLVM IR pilot corpus"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
c-llvm-dataset = "c_llvm_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
